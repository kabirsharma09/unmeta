# Runs both engines' tests, checks the browser engine bundle is up to date, and builds the static site.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps --no-build-isolation -e ".[dev]" && pip install pytest
      - run: pytest -q

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Engine tests (photos, videos, audio, fuzzing)
        run: npm test
      - name: The browser bundle matches the engine source
        run: |
          npm run build:web
          git diff --exit-code -- ../metaclean/static/engine.worker.js

  site:
    needs: [python, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps --no-build-isolation -e .
      - name: Build the static site
        # Set the repository variable PUBLIC_URL (e.g. https://metaclean.example) to turn on indexing and HSTS.
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: metaclean export site --public-url "$PUBLIC_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: site
          if-no-files-found: error
