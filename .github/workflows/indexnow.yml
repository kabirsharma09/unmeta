# After Vercel reports a successful deploy of main (its commit status), tell IndexNow (Bing and others)
# about every page in the live sitemap.
name: IndexNow
on: status
permissions:
  contents: read
jobs:
  ping:
    if: >-
      github.event.context == 'Vercel' && github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/indexnow.py https://unmeta.vercel.app
