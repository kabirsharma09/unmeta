# After Vercel finishes a production deploy of main, tell IndexNow (Bing and others) about every page.
name: IndexNow
on: deployment_status
permissions:
  contents: read
jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/indexnow.py https://unmeta.vercel.app
