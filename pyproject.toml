[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaclean"
license = "MIT"
version = "0.1.0"
description = "UnMeta: see and remove hidden details (location, device, names, AI labels) from photos, videos and audio, losslessly."
requires-python = ">=3.10"
dependencies = ["pillow>=11.3", "pillow-heif>=0.18", "flask>=3.0", "reportlab>=4.0"]

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
dev = ["pytest>=8"]

[project.scripts]
unmeta = "metaclean.cli:main"
metaclean = "metaclean.cli:main"  # old name, kept as an alias

[tool.setuptools]
packages = ["metaclean"]

[tool.setuptools.package-data]
metaclean = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
